{% include base_path %}

<header class="masthead" role="banner">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="{{ site.data.ui-text[site.locale].primary_nav_label | default: "Primary" }}">
        <button type="button" aria-label="{{ site.data.ui-text[site.locale].toggle_menu_label | default: "Toggle menu" }}" aria-haspopup="true" aria-expanded="false" aria-controls="site-nav-hidden-links"><span class="navicon"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist"><a href="{{ base_path }}/"{% if page.url == "/" %} aria-current="page"{% endif %}>{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul id="site-nav-hidden-links" class="hidden-links hidden" aria-hidden="true"></ul>
      </nav>
    </div>
  </div>
</header>
